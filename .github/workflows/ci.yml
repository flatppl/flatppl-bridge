name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  bridgestan:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: |
            .bridgestan
            target/bridgestan-models
          key: bridgestan-2.9.0-threads-${{ matrix.os }}-${{ hashFiles('plugins/bridgestan/tests/models/*.stan', 'plugins/bridgestan/build-model.sh') }}
      - run: |
          for model in plugins/bridgestan/tests/models/*.stan; do
            plugins/bridgestan/build-model.sh "$model" target/bridgestan-models
          done
      - run: cargo test -p fpb-bridgestan -- --ignored
        env:
          FPB_BRIDGESTAN_MODELS: ${{ github.workspace }}/target/bridgestan-models

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          manifest-path: python/pyproject.toml
          environments: test
          locked: false
          cache: false
      - run: pixi run -e test test
