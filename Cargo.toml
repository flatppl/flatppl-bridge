[workspace]
resolver = "3"
members = ["crates/*", "plugins/*", "python"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/flatppl/flatppl-bridge"

[workspace.dependencies]
arrow-array = "60.1.0"
arrow-buffer = "60.1.0"
arrow-cast = "60.1.0"
arrow-data = "60.1.0"
arrow-ipc = "60.1.0"
arrow-schema = "60.1.0"
arrow-select = "60.1.0"
libloading = "0.9.0"
axum = "0.8.9"
futures-util = "0.3"
tokio = "1"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "blocking"] }
serde_json = "1"
sha2 = "0.11"
# Pinned until the flatppl crates are on crates.io.
flatppl-core = { git = "https://github.com/flatppl/flatppl-rust", rev = "1a63919e3e6ddfa104cc656d1a3b2f72ab0ff8c9" }
flatppl-syntax = { git = "https://github.com/flatppl/flatppl-rust", rev = "1a63919e3e6ddfa104cc656d1a3b2f72ab0ff8c9" }
