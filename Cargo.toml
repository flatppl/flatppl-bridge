[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/flatppl/flatppl-bridge"

[workspace.dependencies]
# Pinned until the flatppl crates are on crates.io.
flatppl-core = { git = "https://github.com/flatppl/flatppl-rust", rev = "1a63919e3e6ddfa104cc656d1a3b2f72ab0ff8c9" }
flatppl-syntax = { git = "https://github.com/flatppl/flatppl-rust", rev = "1a63919e3e6ddfa104cc656d1a3b2f72ab0ff8c9" }
